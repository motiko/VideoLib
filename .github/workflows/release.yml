name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v

  release:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

  update-tap:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tap repository
        uses: actions/checkout@v4
        with:
          repository: motiko/homebrew-videolib
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Update Formula version and sha256
        run: |
          python3 - << 'EOF'
          import os, re, urllib.request, hashlib

          tag = os.environ["TAG"]
          url = f"https://github.com/motiko/VideoLib/archive/refs/tags/{tag}.tar.gz"
          print(f"Downloading release tarball from {url}...")
          req = urllib.request.Request(url, headers={"User-Agent": "GitHub-Actions"})
          with urllib.request.urlopen(req) as resp:
              tarball_data = resp.read()

          sha256 = hashlib.sha256(tarball_data).hexdigest()
          print(f"Calculated sha256: {sha256}")

          formula_path = "Formula/videolib.rb"
          with open(formula_path, "r", encoding="utf-8") as f:
              content = f.read()

          content = re.sub(r'url\s+"[^"]+"', f'url "{url}"', content, count=1)
          content = re.sub(r'sha256\s+"[^"]+"', f'sha256 "{sha256}"', content, count=1)

          with open(formula_path, "w", encoding="utf-8") as f:
              f.write(content)
          print("Formula updated successfully.")
          EOF
        env:
          TAG: ${{ github.ref_name }}

      - name: Commit and push formula update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/videolib.rb
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "bump(videolib): update formula to ${{ github.ref_name }}"
            git push origin main
          fi
