[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "videolib"
version = "1.0.0"
description = "Telegram bot that downloads and delivers videos via yt-dlp"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "motiko" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS",
    "Framework :: AsyncIO",
]
dependencies = [
    "python-telegram-bot>=21.0",
    "python-dotenv>=1.0.1",
    "yt-dlp",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff",
]

[project.scripts]
videolib = "src.run:main_sync"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
